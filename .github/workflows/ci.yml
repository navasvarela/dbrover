name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request at a time: a newer push cancels the run it supersedes. GitHub also
# sends two pull_request events for one commit when a stacked pull request's base moves, and the
# second cancels the first. Pushes to main each get a group of their own (the run id), so they are
# never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # dbrover_prebuilt_duckdb links DuckDB's prebuilt library, fetched below, rather than compiling
  # it; see docs/duckdb-prebuilt.md.
  RUSTFLAGS: -D warnings --cfg dbrover_prebuilt_duckdb
  # No debug info: nothing here runs a debugger, and a failed test's panic still names its file
  # and line. Debug info made up a third of the dependencies' build output (measured on Linux),
  # so without it `check` builds and links faster and its caches are smaller. They have to fit
  # under GitHub's 10 GB with the release caches: at 12.8 GB, GitHub evicted main's Linux and
  # macOS caches, and every pull request then built cold, often past the 30-minute limit.
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  # Whether the pull request touches anything but documentation. A docs-only pull request (only
  # docs/, book/, site/, issue templates, Markdown or licence files) skips the Rust steps of
  # `fmt` and `check`, and runs all three `check` jobs on Linux. The jobs still run and report
  # success, because branch protection requires them, but they finish in seconds. `book` still
  # builds the manual. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Compared with the pull request's own head, not HEAD: HEAD is GitHub's test merge, and for
      # a stacked pull request whose base was just rebased GitHub built it on an older merge, so
      # the lower layers' code showed up as this layer's (#206 ran every build that way).
      - id: diff
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "origin/$GITHUB_BASE_REF...$PR_HEAD" \
            | grep -vE '^(docs|book|site|\.github/ISSUE_TEMPLATE)/|\.md$|^LICENSE' || true)
          if [[ -n "$code" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Changes beyond documentation:"
            echo "$code"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: the build and tests are skipped."
          fi

  fmt:
    needs: changes
    # Runs even if `changes` failed: GitHub counts a skipped required check as passed, so a broken
    # `changes` must never skip the checks. CODE is then empty and every step runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@v5
      - if: env.CODE != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: env.CODE != 'false'
        run: cargo fmt --all --check

  # The user manual in book/. A broken link to a page or an image fails the build.
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,mdbook-linkcheck2@0.13.0
      - run: mdbook build book

  check:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      # The first system to fail cancels the other two, so a failure shows in minutes and stops
      # using runners. Not a step that cancels the whole run: that also marked the failing job
      # itself "cancelled", which hid which test failed and let a stack look green (#90).
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # A docs-only pull request skips every step, so it needs no macOS or Windows runner: those
    # queue for minutes (#206's macOS job waited 15) just to report success. The job keeps its
    # `check (macos-latest)` name, which branch protection requires, whatever it runs on. An empty
    # CODE (a broken `changes`) still gets the real runner.
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    # 30 minutes leaves room for a cold Rust cache and still fails a hung runner fast: a Linux job
    # once sat in `apt-get update` for 80 minutes, and without a limit GitHub waits 6 hours.
    # Windows gets 45: since the reports' worker tests its tests alone take about 24 minutes, so at
    # 30 main's cache save was cut off every time, no Windows cache was ever saved, and every pull
    # request then compiled cold and timed out (#397).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    # Every step runs unless `changes` said documentation only.
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@v5
      - if: env.CODE != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Pull requests restore main's cache but never save their own. Each save took 30–50 s,
      # and GitHub keeps 10 GB of cache per repository, so pull request caches pushed main's
      # out and later runs started cold.
      - if: env.CODE != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # DuckDB's own library for this runner, checked against packaging/duckdb/SHA256SUMS; the
      # tests on Windows load its DLL from PATH. The action restores the download from the cache.
      - if: env.CODE != 'false'
        uses: ./.github/actions/duckdb
      - if: env.CODE != 'false'
        name: Fetch DuckDB's prebuilt library
        shell: bash
        run: |
          packaging/duckdb/fetch.sh "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/duckdb" \
            | tee -a "$GITHUB_ENV"
      - if: env.CODE != 'false' && runner.os == 'Windows'
        shell: bash
        run: echo "$DUCKDB_LIB_DIR" >> "$GITHUB_PATH"
      # Headers eframe's windowing backends link against on Linux (same list egui's own CI uses).
      - if: env.CODE != 'false' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      # One container per database server in docker-compose.yml, and its test URL in
      # test-servers.env; a new engine adds to those two files, not to this one. GitHub only
      # runs containers on Linux runners, so on macOS and Windows the URLs stay unset and the
      # server tests skip; the SQLite ones still run. A server that fails to start prints the
      # end of every container's log, which is otherwise lost with the runner.
      - if: env.CODE != 'false' && runner.os == 'Linux'
        name: Start the database servers
        # MongoDB 8 won't start on the runners' kernel; see the mongo service in
        # docker-compose.yml.
        env:
          DBROVER_MONGO_TAG: "7.0"
        run: |
          docker compose up -d --wait || { docker compose logs --tail 40; exit 1; }
          grep -E '^[A-Z_]+=' test-servers.env >> "$GITHUB_ENV"
      # Clippy on macOS found nothing Linux didn't, so it's skipped there to save a build.
      # Windows keeps it: some lints depend on type sizes, and `result_large_err` once failed
      # only there.
      - if: env.CODE != 'false' && runner.os != 'macOS'
        run: cargo clippy --workspace --all-targets
      - if: env.CODE != 'false'
        run: cargo test --workspace
