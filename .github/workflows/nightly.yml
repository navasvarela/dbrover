name: Nightly

# Tests against servers too slow or too large to start with every pull request, once a day and
# on demand. Each pull request runs the CQL tests on ScyllaDB, which is healthy within seconds;
# Apache Cassandra takes about 40 seconds more on a runner (docs/nosql.md, N4), so its run of the
# same tests is here. Trino's image is 1.04 GB to download and its server takes about a gigabyte
# of memory (docs/cloud-data.md, C3); each pull request tries the driver against a stand-in
# coordinator in its tests instead, and the conformance suite runs against Trino here. The
# BigQuery emulator is small (93 MB, healthy within a second) but differs from BigQuery where
# its driver matters most (C4): pull requests replay BigQuery's exchanges, and its catalog and
# paging are tried against the emulator here, in the same job as Trino, so they share a build.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings --cfg dbrover_prebuilt_duckdb

permissions:
  contents: read

jobs:
  cassandra:
    runs-on: ubuntu-latest
    # A cold Rust cache builds the engine's tests in about 15 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Restores main's cache, and saves none of its own: GitHub keeps 10 GB of cache per
      # repository, and a nightly cache would push the pull requests' out.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # The engine links DuckDB; its prebuilt library, as in ci.yml.
      - uses: ./.github/actions/duckdb
      - name: Fetch DuckDB's prebuilt library
        shell: bash
        run: |
          packaging/duckdb/fetch.sh "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/duckdb" \
            | tee -a "$GITHUB_ENV"
      - name: Start Cassandra
        run: |
          docker compose --profile nightly up -d --wait cassandra \
            || { docker compose --profile nightly logs --tail 40 cassandra; exit 1; }
      - name: Run the CQL tests on Cassandra
        env:
          DBROVER_TEST_CASSANDRA_URL: cql://dbrover:dbrover@localhost:59043
        run: |
          cargo test -p dbrover-driver-cassandra -p dbrover-engine
          cargo test -p dbrover-mcp --test cassandra

  warehouses:
    runs-on: ubuntu-latest
    # A cold Rust cache builds the drivers' and the engine's tests in about 15 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Restores main's cache, and saves none of its own, as the job above.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # The engine links DuckDB; its prebuilt library, as in ci.yml.
      - uses: ./.github/actions/duckdb
      - name: Fetch DuckDB's prebuilt library
        shell: bash
        run: |
          packaging/duckdb/fetch.sh "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/duckdb" \
            | tee -a "$GITHUB_ENV"
      - name: Start Trino
        run: |
          docker compose --profile nightly up -d --wait trino \
            || { docker compose --profile nightly logs --tail 40 trino; exit 1; }
      - name: Run the Trino tests
        env:
          DBROVER_TEST_TRINO_URL: trino://dbrover@localhost:58080/memory/default
        run: cargo test -p dbrover-driver-trino
      - name: Start the BigQuery emulator
        run: |
          docker compose --profile nightly up -d --wait bigquery \
            || { docker compose --profile nightly logs --tail 40 bigquery; exit 1; }
      - name: Run the BigQuery tests
        env:
          DBROVER_TEST_BIGQUERY_URL: http://localhost:59050/dbrover
        run: cargo test -p dbrover-driver-bigquery
