[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.19.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/navasvarela/dbrover"
publish = false

[workspace.dependencies]
dbrover-core = { path = "crates/dbrover-core" }
dbrover-driver-mongodb = { path = "crates/dbrover-driver-mongodb" }
dbrover-driver-mysql = { path = "crates/dbrover-driver-mysql" }
dbrover-driver-clickhouse = { path = "crates/dbrover-driver-clickhouse" }
dbrover-driver-duckdb = { path = "crates/dbrover-driver-duckdb" }
dbrover-driver-elasticsearch = { path = "crates/dbrover-driver-elasticsearch" }
dbrover-driver-postgres = { path = "crates/dbrover-driver-postgres" }
dbrover-driver-redis = { path = "crates/dbrover-driver-redis" }
dbrover-driver-sqlite = { path = "crates/dbrover-driver-sqlite" }
dbrover-driver-sqlserver = { path = "crates/dbrover-driver-sqlserver" }
dbrover-document = { path = "crates/dbrover-document" }
dbrover-engine = { path = "crates/dbrover-engine" }
dbrover-export = { path = "crates/dbrover-export" }
dbrover-language = { path = "crates/dbrover-language" }
dbrover-mcp = { path = "crates/dbrover-mcp" }
dbrover-plan = { path = "crates/dbrover-plan" }
dbrover-sql = { path = "crates/dbrover-sql" }
dbrover-ssh = { path = "crates/dbrover-ssh" }
dbrover-store = { path = "crates/dbrover-store" }
dbrover-tls = { path = "crates/dbrover-tls" }

anyhow = "1.0.104"
async-trait = "0.1.92"
# Decodes the salts and hashes of hashed known_hosts entries, as russh does.
data-encoding = "2.11.1"
directories = "6.0.0"
# ClickHouse's official client, over its HTTP interface. No default features (lz4 compression)
# and none of its TLS ones: DbRover hands it a hyper client with dbrover-tls's rustls
# configuration, which also covers `require` and a CA file.
clickhouse = { version = "0.15.3", default-features = false }
# DuckDB 1.5.6 with its Parquet and JSON extensions, inside DbRover so there is nothing to
# install. dbrover-driver-duckdb's manifest picks how: compiled from source (`bundled`) by
# default, or linked from DuckDB's own prebuilt library, as CI and releases do
# (docs/duckdb-prebuilt.md). No default features: they would download a prebuilt libduckdb while
# building, unchecked. The downloads grow by about 13 MB compiled, 16 MB prebuilt, within the
# 30 MB budget in docs/databases.md. Pinned with `~`: the next minor version, 1.20000, bundles a
# development build of DuckDB 2.0.
duckdb = { version = "~1.10506.1", default-features = false }
# With default features off, every one DbRover needs is listed. `links` is what lets
# `ctx.open_url` and hyperlinks open the browser: without it egui-winit only logs
# "feature \"links\" not enabled", and the manual, release page and repository links did nothing.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
# egui_dock 0.21 is built against egui 0.36; bump the egui family only together with it.
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
# "svg" renders the database logos (assets/icons/databases) with resvg.
egui_extras = { version = "0.36.2", features = ["image", "svg"] }
egui_kittest = "0.36.2"
# Only Windows builds use these two, for the renderer that draws without OpenGL 2 (wgpu on
# Direct3D 12, see docs/renderers.md), and the tests that open a window with it. Both are the
# versions eframe 0.36 is built with: bump them only together with it.
wgpu = { version = "30.0.1", default-features = false }
winit = { version = "0.30.13", default-features = false }
# Icon font; 0.14 is the release built against egui 0.36.
egui-phosphor = "0.14.0"
# Encodes the query string of Help › Report a problem…'s address. url's own encoder, which the
# build has already, for reqwest.
form_urlencoded = "1.2.2"
# The macOS menu bar (docs/macos-look.md), the menu crate Tauri uses. macOS only, and without
# default features, which would build GTK on Linux. Its macOS dependencies (objc2, objc2-app-kit,
# crossbeam-channel, dpi) are winit's and rfd's already; it adds keyboard-types.
muda = { version = "0.21.2", default-features = false }
# AppKit, for what eframe doesn't expose on macOS: the pasteboard's text for Edit › Paste, and
# the user's accent colour (NSColor, in an NSColorSpace, with CGFloat components from
# objc2-core-foundation). The versions winit, rfd and muda already use.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSColor",
    "NSColorSpace",
    "NSPasteboard",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
# Decodes the PNGs egui_extras loads (the logo on the Welcome tab).
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# HMAC-SHA1, which OpenSSH hashes host names in known_hosts with. The versions russh uses.
# hmac also checks SCRAM verifiers in dbrover-sql's tests, with sha2 and base64, at the
# versions postgres-protocol uses.
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
base64 = "0.22.1"
jiff = "0.2.38"
keyring = "4.2.0"
# MySQL and MariaDB. No default features, which compress with the zlib C library:
# `minimal-rust` compresses in pure Rust, and TLS is rustls with ring. Its rustls connector
# takes rustls's process-wide provider, so ring must stay the only provider compiled in
# (dbrover-driver-mysql's tests check it).
# MongoDB (docs/nosql.md, N2): the official driver, Apache-2.0. Without its default features,
# which would build `bson` 2 beside 3 (`compat-3-0-0`): `bson-3` and `compat-3-3-0` take bson 3
# alone, `rustls-tls` is rustls on ring, and `dns-resolver` reads `mongodb+srv://` addresses.
mongodb = { version = "3.9.1", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
# The driver's documents, written as canonical Extended JSON (ADR 0006) through serde_json.
bson = { version = "3.1.0", features = ["serde_json-1"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# Find and replace's regular expressions; already built for mysql_common and arrow.
regex = "1.13.1"
# Redis, Valkey and Dragonfly (docs/nosql.md, N1): the community client Redis Inc lists, in
# pure Rust, BSD-3-Clause, releasing every few weeks; `fred`, the alternative, has had no
# release since February 2025. Only its async connection on tokio: none of its TLS features,
# since dbrover-driver-redis opens the TCP or TLS stream itself with dbrover-tls's rustls, and
# none of its typed command helpers, since commands are sent as typed. Pinned to 1.8 patches:
# 2.0 was still in release candidates when N1 started and changes the API.
redis = { version = "~1.8.1", default-features = false, features = ["tokio-comp"] }
rfd = "0.17.2"
# The official MCP SDK, for `dbrover mcp`. Only the server side and the stdio transport; the
# tests add the client to drive it.
rmcp = { version = "3.7.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
# Reads SQL Server's XML showplans (dbrover-plan): the version resvg already builds for the
# database logos, so nothing new is compiled.
roxmltree = "0.20.0"
# Writes `.xlsx` exports (dbrover-export), a row at a time in constant memory, which keeps
# each sheet's rows in a temporary file rather than in memory. 0.100.0 rather than the newer
# 0.101 and 0.102, released in the two weeks before W7d, to let a release settle; it is the
# first built on zip 9, already in the dependency tree.
rust_xlsxwriter = { version = "0.100.0", default-features = false, features = ["constant_memory"] }
# Reads `.xlsx` files back in dbrover-export's tests, to check each cell's type and value.
calamine = { version = "0.37.0", default-features = false }
# Reads a sheet's XML out of an `.xlsx` in dbrover-export's tests; the version rust_xlsxwriter
# writes with.
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
# SSH tunnels, in pure Rust. No default features, which pick aws-lc-rs (CMake and NASM on
# Windows) and zlib compression: ring is the crypto the workspace already builds for rustls,
# and `rsa` keeps RSA keys and host keys working. 0.64.1 rather than the 0.65.0 released the
# day W3 started, to let a new release settle.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
# The HTTP client ClickHouse's client runs on, with rustls for HTTPS. The Elasticsearch driver
# uses it directly (docs/nosql.md, N3), with hyper's own types and http-body-util's bodies, all
# at the versions ClickHouse's client already builds.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "tls12"] }
hyper-util = { version = "0.1.19", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1.5"
# TLS for network connections. rustls rather than OpenSSL leaves nothing to link (see
# docs/releasing.md), and the ring provider builds with only a C compiler, where aws-lc-rs
# also wants CMake and NASM on Windows.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Downloads, verifies and installs updates in the formats cargo-packager signs (R3). Its
# rustls feature uses reqwest's ring provider and the OS's root certificates.
cargo-packager-updater = "0.2.3"
# Compares the running version with the newest release's tag, for the update check.
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
# The syntax checker's parser, for PostgreSQL and SQLite statements.
# "visitor" lets the statement classifier walk every nested statement and query.
sqlparser = { version = "0.63.0", features = ["visitor"] }
# `preserve_order` so the cell viewer pretty-prints JSON without sorting its keys.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-postgres = "0.7.18"
# tokio-postgres's own protocol crate, for hashing role passwords into SCRAM verifiers on the
# client (dbrover-sql): the version tokio-postgres pulls in, so nothing new is built.
postgres-protocol = "0.6.12"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
# TLS on a tokio stream, for the Redis driver, which hands the encrypted stream to its client.
# The version hyper-rustls and tiberius already build. No default features: they would pick
# aws-lc-rs, where dbrover-tls's configuration names ring.
tokio-rustls = { version = "0.26.6", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
# SQL Server and Azure SQL, over TDS in pure Rust. No default features, which use native-tls
# (OpenSSL on Linux): TLS is rustls instead. Its rustls feature also compiles in aws-lc-rs,
# through tokio-rustls's default features, which makes rustls unable to pick a process-wide
# provider on its own; the network drivers install ring as that provider before connecting
# (see dbrover-driver-sqlserver's `tls` module). The webpki roots back `verify-full` without a
# CA file, as for the other engines.
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "rustls-webpki-roots"] }
# Adapts tokio's TCP stream to the futures I/O traits tiberius takes.
tokio-util = { version = "0.7.20", features = ["compat"] }
# The update check's one HTTPS request. Blocking and small; it runs on the engine's blocking
# pool. Its rustls feature uses the ring provider and webpki-roots, both already built for
# PostgreSQL TLS.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# The public web authorities, trusted by `verify-full` when no CA file is given.
webpki-roots = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# What release builds ship. Thin LTO with one codegen unit trades a slower release build for a
# smaller binary, and debug symbols are stripped from what ships. Measured on an Apple-silicon
# Mac when this was added (R1): the binary went from 19.5 MB to 14.6 MB, and a clean release
# build of the app from about 51 s to 63 s.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# tiberius 0.13.0's `cancel_query` stops reading at the end of the cancelled reply, but SQL
# Server 2022 sends its acknowledgement as a message of its own, so the client was left one
# reply behind. tiberius-rs/tiberius#460 fixes it; this is that pull request's commit (0.13.0,
# four collation fixes from upstream `main`, and the fix). Drop this once a release has it.
[patch.crates-io]
tiberius = { git = "https://github.com/tiberius-rs/tiberius", rev = "f177f879dfb83d8a8d8276f02ae61859691b7d11" }
