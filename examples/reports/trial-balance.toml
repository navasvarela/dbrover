# Trial balance: each account's debits, credits and balance in a period, with a subtotal for
# each kind of account and a total, to Excel and CSV. Runs on the "ledger" data source that
# ledger.sql makes.

[report]
name = "Trial balance"
description = "Debits, credits and the balance of each account in a period, with subtotals."
# The period: from :since, up to but not including :until.
params = { since = "date", until = "date" }

# Every account, with each of its entries in the period: an account without one comes once,
# with no amounts, so it still shows. The amounts are declared, so each is rounded to the cent
# as it loads and summed exactly in DuckDB.
[[source]]
id = "lines"
data_source = "ledger"
query = """
SELECT a.code AS account, a.name AS account_name, a.kind, e.debit, e.credit
FROM accounts a
LEFT JOIN entries e
  ON e.account_id = a.id AND e.booked_on >= :since AND e.booked_on < :until
"""
columns = [
  { name = "account",      type = "text" },
  { name = "account_name", type = "text" },
  { name = "kind",         type = "text" },
  { name = "debit",        type = "decimal(18,2)" },
  { name = "credit",       type = "decimal(18,2)" },
]

# GROUPING SETS makes, in one pass, a row per account, a subtotal per kind of account, and the
# total, whose debits and credits are equal. The kinds come in the chart of accounts' order.
[combine]
query = """
SELECT CASE WHEN GROUPING(kind) = 1 THEN 'Total'
            WHEN GROUPING(account) = 1 THEN 'Total ' || kind
            ELSE kind END AS kind,
       account, account_name,
       COALESCE(SUM(debit), 0) AS debit,
       COALESCE(SUM(credit), 0) AS credit,
       COALESCE(SUM(debit), 0) - COALESCE(SUM(credit), 0) AS balance
FROM lines
GROUP BY GROUPING SETS ((kind, account, account_name), (kind), ())
ORDER BY GROUPING(kind),
         CASE kind WHEN 'asset' THEN 1 WHEN 'liability' THEN 2 WHEN 'equity' THEN 3
                   WHEN 'income' THEN 4 ELSE 5 END,
         GROUPING(account),
         account
"""

[[output]]
format = "xlsx"
file = "trial-balance-{since:%Y-%m}.xlsx"
sheet_name = "Trial balance"
columns = [
  { name = "Kind",    from = "kind" },
  { name = "Account", from = "account", type = "text" },
  { name = "Name",    from = "account_name" },
  { name = "Debit",   from = "debit",   type = "decimal(18,2)", format = "#,##0.00" },
  { name = "Credit",  from = "credit",  type = "decimal(18,2)", format = "#,##0.00" },
  { name = "Balance", from = "balance", type = "decimal(18,2)", format = "#,##0.00;[Red]-#,##0.00" },
]

[[output]]
format = "csv"
file = "trial-balance-{since:%Y-%m}.csv"
columns = "same"
