# General ledger: every entry in a period, by account, with its counterparty and each account's
# running balance over the period, to CSV and Excel. Reads two data sources: the "ledger"
# SQLite data source that ledger.sql makes, and the "crm" MongoDB data source whose
# counterparties ledger-counterparties.js makes.

[report]
name = "General ledger"
description = "Every entry in a period, with its counterparty and each account's running balance."
params = { since = "date", until = "date" }
timeout = "1h"

# SQLite: the period's entries. Declared, so the amounts are rounded to the cent as they load
# and the counterparty ids stay text.
[[source]]
id = "entries"
data_source = "ledger"
query = """
SELECT e.id, e.booked_on, e.journal, a.code AS account, a.name AS account_name,
       e.counterparty_id, e.memo, e.debit, e.credit
FROM entries e
JOIN accounts a ON a.id = e.account_id
WHERE e.booked_on >= :since AND e.booked_on < :until
"""
columns = [
  { name = "id",              type = "integer" },
  { name = "booked_on",       type = "date" },
  { name = "journal",         type = "integer" },
  { name = "account",         type = "text" },
  { name = "account_name",    type = "text" },
  { name = "counterparty_id", type = "text" },
  { name = "memo",            type = "text" },
  { name = "debit",           type = "decimal(18,2)" },
  { name = "credit",          type = "decimal(18,2)" },
]
# A year of a busy ledger runs past the default million rows.
max_rows = 5000000
max_bytes = "4 GiB"
timeout = "30m"

# MongoDB: the counterparties those entries name, read by their ids rather than the whole
# collection. batch_size is small here only to show the batches in the report's tab; MongoDB
# takes 1,000 ids a query without it. A counterparty with no country gets "unknown".
[[source]]
id = "counterparties"
data_source = "crm"
lookup = { from = "entries", column = "counterparty_id", as = "ids", batch_size = 10 }
query = "db.counterparties.find({_id: {$in: :ids}})"
columns = [
  { name = "counterparty_id", from = "_id" },
  { name = "counterparty",    from = "name" },
  { name = "country",         from = "address.country", default = "unknown" },
]

# Each entry with its counterparty, if it has one, and the running balance of its account: a
# window over the account's entries in order, from the period's first.
[combine]
query = """
SELECT e.booked_on, e.journal, e.account, e.account_name, c.counterparty, c.country, e.memo,
       e.debit, e.credit,
       SUM(e.debit - e.credit) OVER (
         PARTITION BY e.account ORDER BY e.booked_on, e.journal, e.id
         ROWS UNBOUNDED PRECEDING
       ) AS running_balance
FROM entries e
LEFT JOIN counterparties c USING (counterparty_id)
ORDER BY e.account, e.booked_on, e.journal, e.id
"""

[[output]]
format = "csv"
file = "general-ledger-{since:%Y-%m}.csv"
columns = [
  { name = "Date",         from = "booked_on", type = "date", format = "yyyy-mm-dd" },
  { name = "Journal",      from = "journal",   type = "integer" },
  { name = "Account",      from = "account",   type = "text" },
  { name = "Name",         from = "account_name" },
  { name = "Counterparty", from = "counterparty" },
  { name = "Country",      from = "country" },
  { name = "Memo",         from = "memo" },
  { name = "Debit",        from = "debit",           type = "decimal(18,2)", format = "#,##0.00" },
  { name = "Credit",       from = "credit",          type = "decimal(18,2)", format = "#,##0.00" },
  { name = "Balance",      from = "running_balance", type = "decimal(18,2)", format = "#,##0.00" },
]

[[output]]
format = "xlsx"
file = "general-ledger-{since:%Y-%m}.xlsx"
sheet_name = "General ledger"
# Past an Excel sheet's 1,048,576 rows, go on in "General ledger 2", and so on.
continue_on_new_sheet = true
columns = "same"
