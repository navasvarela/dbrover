# Valuation: each transaction valued at its asset's price in the hour it ran, to Excel and CSV.
# Reads three data sources and combines them in DuckDB: the transactions in PostgreSQL, which
# valuation-postgres.sql makes; the assets they use in DynamoDB, which valuation-assets.partiql
# makes; and the hourly prices in a DuckDB file, which valuation-prices.sql makes.

[report]
name = "Valuation"
description = "Each transaction valued at its asset's price in the hour it ran."
# The period: from :since, up to but not including :until.
params = { since = "timestamp", until = "timestamp" }

# PostgreSQL: the period's transactions, filtered in the query, then loaded into the run's
# DuckDB. amount is in the asset's smallest unit; declared, it loads as an exact DECIMAL.
[[source]]
id = "tx"
data_source = "ledger-postgres"
query = """
SELECT id, wallet, asset_id, amount, executed_at
FROM valuation.transactions
WHERE executed_at >= :since AND executed_at < :until
"""
columns = [
  { name = "id",          type = "integer" },
  { name = "wallet",      type = "text" },
  { name = "asset_id",    type = "text" },
  { name = "amount",      type = "decimal(38,0)" },
  { name = "executed_at", type = "timestamp" },
]

# DynamoDB: the assets those transactions use, read by key (asset_id is the table's partition
# key), never scanned. Its items are documents, so the source declares the columns it makes;
# "symbol" is quoted because PartiQL keeps the word for itself.
[[source]]
id = "assets"
data_source = "assets-dynamodb"
lookup = { from = "tx", column = "asset_id", as = "asset_ids" }
query = 'SELECT asset_id, "symbol", unit, metadata FROM valuation_assets WHERE asset_id IN :asset_ids'
columns = [
  { name = "asset_id", type = "text" },
  { name = "symbol",   type = "text" },
  # The size of the asset's smallest unit: 0.000000000000000001 for ETH's 18 places.
  { name = "unit",     type = "decimal(38,18)" },
  { name = "chain",    from = "metadata.chain", type = "text", default = "unknown" },
]

# DuckDB: the price file, attached read-only and read in place, not copied.
[[source]]
id = "prices"
data_source = "prices-duckdb"
attach = true

# DuckDB SQL over the tables "tx" and "assets" and the attached database "prices". An amount
# times its unit is the quantity, exactly; ASOF JOIN takes, for each transaction, the latest
# price at or before it. Multiplying decimals keeps every digit; dividing would give a double,
# so this report doesn't.
[combine]
query = """
SELECT tx.executed_at, tx.wallet, assets.symbol, assets.chain,
       tx.amount * assets.unit AS quantity, p.price_usd,
       tx.amount * assets.unit * p.price_usd AS value_usd
FROM tx
JOIN assets USING (asset_id)
ASOF JOIN prices.hourly_prices p
  ON p.asset = assets.symbol AND p.hour <= tx.executed_at
ORDER BY tx.executed_at, tx.id
"""
memory_limit = "1 GiB"

[[output]]
format = "xlsx"
file = "valuation-{since:%Y-%m}.xlsx"
sheet_name = "Valuation"
columns = [
  { name = "Executed",    from = "executed_at", type = "timestamp", format = "yyyy-mm-dd hh:mm" },
  { name = "Wallet",      from = "wallet" },
  { name = "Asset",       from = "symbol" },
  { name = "Chain",       from = "chain" },
  { name = "Quantity",    from = "quantity",  type = "decimal(38,18)" },
  { name = "Price (USD)", from = "price_usd", type = "decimal(38,8)", format = "#,##0.00######" },
  { name = "Value (USD)", from = "value_usd", type = "decimal(38,2)", format = "#,##0.00" },
]

# The CSV file keeps every digit DuckDB computed, 26 places for a value, to check against;
# the Excel file above rounds values to the cent, once, as it writes them.
[[output]]
format = "csv"
file = "valuation-{since:%Y-%m}.csv"
columns = [
  { name = "Executed",    from = "executed_at", type = "timestamp" },
  { name = "Wallet",      from = "wallet" },
  { name = "Asset",       from = "symbol" },
  { name = "Chain",       from = "chain" },
  { name = "Quantity",    from = "quantity",  type = "decimal" },
  { name = "Price (USD)", from = "price_usd", type = "decimal" },
  { name = "Value (USD)", from = "value_usd", type = "decimal" },
]
