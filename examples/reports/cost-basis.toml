# Cost basis and realised gains: each disposal in a period matched against the lots it used up,
# first in, first out, with its cost, its proceeds and the gain, to Excel and CSV. Reads the same
# three data sources as valuation.toml: the transactions in PostgreSQL, the assets in DynamoDB
# and the hourly prices in a DuckDB file.

[report]
name = "Cost basis and realised gains"
description = "Each disposal matched against its FIFO lots, with its cost, proceeds and gain."
# The period whose disposals are reported: from :since, up to but not including :until.
params = { since = "timestamp", until = "timestamp" }

# PostgreSQL: every transaction before the period's end, not only the period's: a disposal in
# October may use up a lot bought in September.
[[source]]
id = "tx"
data_source = "ledger-postgres"
query = """
SELECT id, asset_id, amount, executed_at
FROM valuation.transactions
WHERE executed_at < :until
"""
columns = [
  { name = "id",          type = "integer" },
  { name = "asset_id",    type = "text" },
  { name = "amount",      type = "decimal(38,0)" },
  { name = "executed_at", type = "timestamp" },
]

# DynamoDB: the assets those transactions use, read by key, as in valuation.toml.
[[source]]
id = "assets"
data_source = "assets-dynamodb"
lookup = { from = "tx", column = "asset_id", as = "asset_ids" }
query = 'SELECT asset_id, "symbol", unit FROM valuation_assets WHERE asset_id IN :asset_ids'
columns = [
  { name = "asset_id", type = "text" },
  { name = "symbol",   type = "text" },
  { name = "unit",     type = "decimal(38,18)" },
]

[[source]]
id = "prices"
data_source = "prices-duckdb"
attach = true

# FIFO without a loop. Each acquisition of an asset is a lot: a range of the asset's running
# quantity, from what was acquired before it to that plus its own. Each disposal is a range of
# the asset's running disposed quantity in the same way. First in, first out means a disposal
# uses up the lots whose ranges overlap its own, by as much as they overlap, which a join on
# the overlap finds. That holds as long as an asset's holding never goes below zero, as in the
# examples' data. Every quantity and price is a decimal, so every product is exact.
[combine]
query = """
WITH moves AS (
  SELECT tx.id, tx.executed_at, assets.symbol, tx.amount * assets.unit AS quantity,
         p.price_usd
  FROM tx
  JOIN assets USING (asset_id)
  ASOF JOIN prices.hourly_prices p
    ON p.asset = assets.symbol AND p.hour <= tx.executed_at
),
lots AS (
  SELECT symbol, executed_at AS acquired_at, price_usd AS cost_price,
         SUM(quantity) OVER running - quantity AS starts_at,
         SUM(quantity) OVER running AS ends_at
  FROM moves
  WHERE quantity > 0
  WINDOW running AS (PARTITION BY symbol ORDER BY executed_at, id ROWS UNBOUNDED PRECEDING)
),
disposals AS (
  SELECT id, symbol, executed_at AS disposed_at, price_usd AS sale_price,
         SUM(-quantity) OVER running + quantity AS starts_at,
         SUM(-quantity) OVER running AS ends_at
  FROM moves
  WHERE quantity < 0
  WINDOW running AS (PARTITION BY symbol ORDER BY executed_at, id ROWS UNBOUNDED PRECEDING)
),
matched AS (
  SELECT d.disposed_at, d.id, d.symbol, l.acquired_at, l.cost_price, d.sale_price,
         LEAST(l.ends_at, d.ends_at) - GREATEST(l.starts_at, d.starts_at) AS quantity
  FROM disposals d
  JOIN lots l
    ON l.symbol = d.symbol AND l.starts_at < d.ends_at AND d.starts_at < l.ends_at
  WHERE d.disposed_at >= :since AND d.disposed_at < :until
)
SELECT disposed_at, symbol, acquired_at, quantity, cost_price, sale_price,
       quantity * cost_price AS cost,
       quantity * sale_price AS proceeds,
       quantity * sale_price - quantity * cost_price AS gain
FROM matched
ORDER BY disposed_at, id, acquired_at
"""
memory_limit = "1 GiB"

[[output]]
format = "xlsx"
file = "cost-basis-{since:%Y-%m}.xlsx"
sheet_name = "Realised gains"
columns = [
  { name = "Disposed",         from = "disposed_at", type = "timestamp", format = "yyyy-mm-dd hh:mm" },
  { name = "Asset",            from = "symbol" },
  { name = "Lot acquired",     from = "acquired_at", type = "timestamp", format = "yyyy-mm-dd hh:mm" },
  { name = "Quantity",         from = "quantity",    type = "decimal(38,18)" },
  { name = "Cost price (USD)", from = "cost_price",  type = "decimal(38,8)", format = "#,##0.00######" },
  { name = "Sale price (USD)", from = "sale_price",  type = "decimal(38,8)", format = "#,##0.00######" },
  { name = "Cost (USD)",       from = "cost",        type = "decimal(38,2)", format = "#,##0.00" },
  { name = "Proceeds (USD)",   from = "proceeds",    type = "decimal(38,2)", format = "#,##0.00" },
  { name = "Gain (USD)",       from = "gain",        type = "decimal(38,2)", format = "#,##0.00;[Red]-#,##0.00" },
]

# The CSV file keeps every digit, to check against.
[[output]]
format = "csv"
file = "cost-basis-{since:%Y-%m}.csv"
columns = [
  { name = "Disposed",         from = "disposed_at", type = "timestamp" },
  { name = "Asset",            from = "symbol" },
  { name = "Lot acquired",     from = "acquired_at", type = "timestamp" },
  { name = "Quantity",         from = "quantity",    type = "decimal" },
  { name = "Cost price (USD)", from = "cost_price",  type = "decimal" },
  { name = "Sale price (USD)", from = "sale_price",  type = "decimal" },
  { name = "Cost (USD)",       from = "cost",        type = "decimal" },
  { name = "Proceeds (USD)",   from = "proceeds",    type = "decimal" },
  { name = "Gain (USD)",       from = "gain",        type = "decimal" },
]
