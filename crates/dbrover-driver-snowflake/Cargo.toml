[package]
name = "dbrover-driver-snowflake"
description = "Snowflake driver for DbRover, over Snowflake's SQL API, with statements run as jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbrover-cloud.workspace = true
dbrover-core.workspace = true
# Later partitions of a result come gzipped.
flate2.workspace = true
# Writes dates, times and timestamps as Snowflake's console shows them.
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
# Each request's `requestId` is DbRover's own, so a resubmitted statement never runs twice.
uuid.workspace = true

[dev-dependencies]
# Reads the claims of the JWT a request carried.
base64.workspace = true
dbrover-core = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
# The test server that replays Snowflake's exchanges listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
