[package]
name = "dbrover-driver-duckdb"
description = "DuckDB driver for DbRover, with DuckDB inside: compiled, or linked from its prebuilt library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
# Signs in to a data source's bucket with C0's AWS sign-in (C2).
dbrover-cloud.workspace = true
dbrover-core.workspace = true
# Only to read a statement's first word, to tell a change's row count from a result.
dbrover-sql.workspace = true
# The work folder of a Parquet export.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# DuckDB compiled from its C++ sources, which takes 10 to 14 minutes on CI's runners, unless the
# build passes `--cfg dbrover_prebuilt_duckdb` in RUSTFLAGS: then libduckdb-sys links the library
# packaging/duckdb/fetch.sh downloaded and checked. A cfg rather than a feature, because a
# feature can only add `bundled`, never take it away. See docs/duckdb-prebuilt.md.
[target.'cfg(not(dbrover_prebuilt_duckdb))'.dependencies]
duckdb = { workspace = true, features = ["bundled", "parquet", "json"] }

[target.'cfg(dbrover_prebuilt_duckdb)'.dependencies]
duckdb.workspace = true

[dev-dependencies]
# A token endpoint on the loopback address, for signing in to the Google Cloud Storage stand-in.
dbrover-cloud = { workspace = true, features = ["stand-in"] }
dbrover-core = { workspace = true, features = ["conformance"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
