[package]
name = "dbrover-core"
description = "Domain types and driver traits shared by every DbRover crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes the driver conformance suite to driver crates' tests. See docs/testing.md.
conformance = ["tokio/io-util", "tokio/net"]

[dependencies]
# A result's rows as Arrow batches, for paths that move many rows (ADR 0007).
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
serde.workspace = true
# Git blob ids of files (VC1, docs/version-control.md), at the version dbrover-ssh builds.
sha1.workspace = true
thiserror.workspace = true
# The pause between a job's polls (C0f).
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true

[dev-dependencies]
# Paused time, for the pauses between a job's polls.
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

[lints]
workspace = true
