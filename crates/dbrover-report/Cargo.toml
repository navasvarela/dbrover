[package]
name = "dbrover-report"
description = "Reports: the report file, its parameters and outputs, the plan of a run, and the run itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A [[chart]]'s keys, read and drawn as a console's chart is (docs/charts-as-code.md, CH3).
dbrover-chart.workspace = true
dbrover-core.workspace = true
# The run's own DuckDB, which sources load into and the combine step runs in.
dbrover-driver-duckdb.workspace = true
# Reads a document source's items, to take its declared columns from them.
dbrover-document.workspace = true
dbrover-export.workspace = true
# A chart's PNG and its pixels' limit.
dbrover-picture.workspace = true
dbrover-language.workspace = true
dbrover-sql.workspace = true
futures-util.workspace = true
jiff.workspace = true
# Compiles a [combine]'s PRQL to DuckDB's SQL.
prqlc.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
# Lays out a report file's TOML for Format (docs/report-editor.md, RP8g), token by token.
toml_parser.workspace = true
tracing.workspace = true

[dev-dependencies]
calamine.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
