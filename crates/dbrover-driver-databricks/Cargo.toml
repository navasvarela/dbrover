[package]
name = "dbrover-driver-databricks"
description = "Databricks SQL driver for DbRover, over the Statement Execution API, with statements run as jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbrover-cloud.workspace = true
dbrover-core.workspace = true
# Unity Catalog's paths and query parameters carry the explorer's names.
form_urlencoded.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
dbrover-core = { workspace = true, features = ["conformance"] }
# The test server that replays Databricks's exchanges listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
