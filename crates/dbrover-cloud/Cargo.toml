[package]
name = "dbrover-cloud"
description = "Signing in to cloud providers with the sign-in already on the machine, for DbRover's cloud data sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-config.workspace = true
aws-credential-types.workspace = true
aws-runtime.workspace = true
aws-smithy-http-client.workspace = true
base64.workspace = true
dbrover-core.workspace = true
dbrover-tls.workspace = true
form_urlencoded.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
# Reads the expiry the Azure CLIs print (C0c).
jiff.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Runs `az` and `azd` for an Entra ID token (C0c).
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
# `ConfigLoader::env`, so the tests read no variable of the machine's.
aws-config = { workspace = true, features = ["test-util"] }
aws-types.workspace = true
tempfile.workspace = true
# The stand-in token endpoint of the tests listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
