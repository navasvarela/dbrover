[package]
name = "dbrover-driver-athena"
description = "Amazon Athena driver for DbRover, on AWS's SDK, with queries run as jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
aws-sdk-athena.workspace = true
dbrover-cloud.workspace = true
dbrover-core.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
dbrover-core = { workspace = true, features = ["conformance"] }
serde_json.workspace = true
# The test server that replays Athena's exchanges listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
