[package]
name = "dbrover-driver-athena"
description = "Amazon Athena driver for DbRover, on AWS's SDK, with queries run as jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The replay server of the tests, on the loopback address, so other crates' tests can run a
# report against a stand-in Athena without an account (RS7f). Its listener and its exchanges
# need tokio's `net` and `io-util`, and serde_json.
stand-in = ["dep:serde_json", "tokio/net", "tokio/io-util"]

[dependencies]
async-trait.workspace = true
aws-sdk-athena.workspace = true
dbrover-cloud.workspace = true
dbrover-core.workspace = true
# The replay server's exchanges, with the `stand-in` feature and in the tests.
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
dbrover-core = { workspace = true, features = ["conformance"] }
serde_json.workspace = true
# The test server that replays Athena's exchanges listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
