[package]
name = "dbrover-mcp"
description = "DbRover's MCP server: a project's data sources, with its permissions, for AI assistants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dbrover-core.workspace = true
dbrover-engine.workspace = true
dbrover-export.workspace = true
dbrover-language.workspace = true
dbrover-sql.workspace = true
dbrover-store.workspace = true
jiff.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
dbrover-language = { workspace = true, features = ["test-language"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
rusqlite.workspace = true
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true

[[test]]
name = "stdio"
harness = false

[[test]]
name = "permissions"
harness = false

[[test]]
name = "login"
harness = false

[[test]]
name = "redis"
harness = false

[[test]]
name = "mongodb"
harness = false

[[test]]
name = "elasticsearch"
harness = false

[[test]]
name = "clickhouse"
harness = false
