[package]
name = "dbrover-driver-trino"
description = "Trino, Starburst and Presto driver for DbRover, over Trino's HTTP protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
dbrover-core.workspace = true
dbrover-tls.workspace = true
# The protocol's session headers carry values URL-encoded as forms are.
form_urlencoded.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
serde.workspace = true
# Each value of a row is kept as the raw JSON Trino wrote, so numbers keep every digit.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
dbrover-core = { workspace = true, features = ["conformance"] }
# The small server that answers the protocol in the tests listens on the loopback address.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
