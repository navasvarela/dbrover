[package]
name = "dbrover-driver-clickhouse"
description = "ClickHouse driver for DbRover, over ClickHouse's HTTP interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A result as Arrow batches, from ClickHouse's ArrowStream format (ADR 0007).
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
clickhouse.workspace = true
dbrover-core.workspace = true
dbrover-tls.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
# Each value of a row is read as raw JSON text, so numbers keep every digit.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
dbrover-core = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
